[build-system]
requires = ["scikit-build-core"]
build-backend = "scikit_build_core.build"

[project]
name = "rocprofiler-register"
readme = "README.md"
dynamic = ["version"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "VERSION"
regex = '''(?m)^(?P<version>\d+\.\d+\.\d+)$'''
result = "{version}"

[tool.scikit-build]
build.verbose = true
cmake.args = [
    "-DROCPROFILER_REGISTER_BUILD_TESTS=ON",
    "-DROCPROFILER_REGISTER_BUILD_SAMPLES=ON"
]

[tool.black]
line-length = 90
target-version = ['py36', 'py37', 'py38', 'py39', 'py310']
include = '\.py$'
exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.github
    | \.tox
    | \.venv
    | \.misc
    | \.vscode
    | \.cache
    | \.pytest_cache
    | dist
    | external
    | build
    | build-release
    | build-rocprofiler
  )/
)
'''
